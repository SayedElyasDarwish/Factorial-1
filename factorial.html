<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Factorial N!</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff;--fg:#1a1a1a;--card:#f1f3f6;--accent:#2563eb;--onaccent:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15171a;--fg:#eceef1;--card:#23262b;--accent:#6ea8fe;--onaccent:#111}}
:root[data-theme="dark"]{--bg:#15171a;--fg:#eceef1;--card:#23262b;--accent:#6ea8fe;--onaccent:#111}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;padding:24px}
main{width:100%;max-width:480px;background:var(--card);border-radius:12px;padding:24px}
h1{font-size:1.3rem;margin:0 0 8px}
p{margin:0 0 16px;line-height:1.5}
input{width:100%;box-sizing:border-box;padding:10px;font-size:1rem;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--fg)}
button{margin-top:12px;padding:10px 18px;font-size:1rem;border:0;border-radius:8px;background:var(--accent);color:var(--onaccent);cursor:pointer}
#answer{margin-top:16px;font-size:1.15rem;font-weight:600;word-break:break-all}
</style>
</head>
<body>
<main>
<h1>Factorial N!</h1>
<p>Calculates N! = N * (N−1) * ... * 1. Negative numbers are unspecified, and 0! = 1.</p>
<label for="n">Enter N:</label>
<input id="n" type="number" step="1" placeholder="e.g. 10">
<button id="go">Calculate</button>
<div id="answer" aria-live="polite"></div>
</main>
<script>
const input = document.getElementById("n");
const out = document.getElementById("answer");
function compute(n) {

  if (n < 0) return "Answer: Unspecified";
  if (n > 1000) return "Please use N up to 1000.";
  let result = 1n;                 // BigInt so big factorials stay exact
  for (let i = 2; i <= n; i++) {
    result *= BigInt(i);
  }
  return "Answer: " + result.toString();
}
function run() {
  const raw = input.value.trim();
  const n = Number(raw);
  if (raw === "" || !Number.isInteger(n)) {
    out.textContent = "Please enter a whole number.";
    return;
  }
  out.textContent = compute(n);
}
document.getElementById("go").addEventListener("click", run);
input.addEventListener("keydown", e => { if (e.key === "Enter") run(); });
</script>
</body>
</html>
